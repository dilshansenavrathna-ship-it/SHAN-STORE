<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHAN STORE - Free Fire Videos</title>
  <style>
    body { background: #070110; color: #fff; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; padding: 20px; overflow-x: hidden; }
    h1 { font-size: 2.5rem; text-shadow: 0 0 10px #a855f7, 0 0 20px #a855f7; margin-bottom: 5px; color: #f3e8ff; }
    .subtitle { color: #c084fc; margin-bottom: 40px; font-weight: bold; }
    /* Lightning Background Animation */
    .bg-lightning { position: fixed; top:0; left:0; width:100vw; height:100vh; background: radial-gradient(circle, transparent 60%, #05000a 100%); z-index: -1; animation: storm 5s infinite; }
    @keyframes storm { 0%, 95%, 98% { background-color: transparent; } 96%, 99% { background-color: #3b0764; } }
    /* Layout and Cards */
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; max-width: 1100px; margin: 0 auto; }
    .card { background: #120324; border: 2px solid #a855f7; border-radius: 16px; padding: 15px; box-shadow: 0 0 15px rgba(168, 85, 247, 0.3); transition: transform 0.3s; }
    .card:hover { transform: scale(1.03); box-shadow: 0 0 25px rgba(168, 85, 247, 0.6); }
    video { width: 100%; border-radius: 10px; border: 1px solid #a855f7; background: #000; }
    .price { font-size: 1.5rem; color: #e9d5ff; font-weight: bold; margin: 15px 0; text-shadow: 0 0 5px #a855f7; }
    .btn { display: block; background: linear-gradient(135deg, #25d366, #128c7e); color: white; padding: 12px; text-decoration: none; border-radius: 30px; font-weight: bold; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); transition: 0.3s; }
    .btn:hover { box-shadow: 0 0 15px #25d366; }
    /* Fixed Music Control */
    #music-btn { position: fixed; bottom: 20px; right: 20px; background: #a855f7; border: none; padding: 15px; border-radius: 50%; color: #fff; cursor: pointer; box-shadow: 0 0 10px #a855f7; z-index: 10; font-size: 1.2rem; }
  </style>
</head>
<body>
  <div class="bg-lightning"></div>
  <button id="music-btn" onclick="togglePlay()">🎵</button>
  <audio id="bg-audio" loop src="your-music.mp3"></audio> <!-- Replace with your storage music URL -->

  <h1>⚡ SHAN STORE ⚡</h1>
  <div class="subtitle">PREMIUM FREE FIRE VIDEOS</div>

  <div class="grid">
    <!-- Video Card 1 -->
    <div class="card">
      <video controls src="video1.mp4"></video> <!-- Replace with your video storage URL -->
      <h3>Elite Rush Montage</h3>
      <div class="price">Rs. 2500</div>
      <a href="https://wa.me/YOUR_PHONE_NUMBER?text=Hi! I want to buy Elite Rush Montage (Rs. 2500)" target="_blank" class="btn">Order via WhatsApp</a>
    </div>
    <!-- Video Card 2 -->
    <div class="card">
      <video controls src="video2.mp4"></video>
      <h3>One Tap Headshot Special</h3>
      <div class="price">Rs. 3500</div>
      <a href="https://wa.me/YOUR_PHONE_NUMBER?text=Hi! I want to buy Headshot Special (Rs. 3500)" target="_blank" class="btn">Order via WhatsApp</a>
    </div>
    <!-- Video Card 3 -->
    <div class="card">
      <video controls src="video3.mp4"></video>
      <h3>Grandmaster Gameplay</h3>
      <div class="price">Rs. 5500</div>
      <a href="https://wa.me/YOUR_PHONE_NUMBER?text=Hi! I want to buy Grandmaster Gameplay (Rs. 5500)" target="_blank" class="btn">Order via WhatsApp</a>
    </div>
  </div>

  <script>
    const audio = document.getElementById("bg-audio");
    function togglePlay() { audio.paused ? audio.play() : audio.pause(); }
  </script>
</body>
</html>
